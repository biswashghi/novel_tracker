# Overlay for `npm run e2e:stack:up` (docs/testing-locally.md). Applied on
# top of docker-compose.yml via:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml --env-file infra/.env.e2e up -d --wait
#
# Swaps in a realm that seeds a throwaway test user with direct Keycloak
# login (no Google federation), so e2e tests never depend on real Google
# OAuth. Never merge infra/keycloak-realm.e2e.json's test user into
# infra/keycloak-realm.json (the production realm export).
services:
  keycloak:
    # docker-compose.yml sets KC_HOSTNAME straight from AUTH_HOST
    # ("localhost:8793"), but Keycloak's hostname v2 provider rejects a bare
    # "host:port" string — it wants either a plain hostname (no port) or a
    # full URL. Override it to a full URL here rather than changing
    # AUTH_HOST itself, since AUTH_HOST is also used unmodified to build
    # KEYCLOAK_ISSUER (http://${AUTH_HOST}/realms/... below), which needs
    # the bare "host:port" form.
    environment:
      KC_HOSTNAME: http://${AUTH_HOST}
    volumes:
      - ./keycloak-realm.e2e.json:/opt/keycloak/data/import/novel-tracker-realm.json:ro

  api:
    # docker-compose.yml's default hardcodes `https://${AUTH_HOST}`, but the
    # local Keycloak only serves plain HTTP (KC_HTTP_ENABLED, no TLS) — so
    # the production https:// scheme would make token issuer verification
    # fail here. KEYCLOAK_ISSUER must stay host-reachable (it has to equal
    # the `iss` claim of tokens issued to the browser-side extension, which
    # signs in via http://${AUTH_HOST}), so JWKS fetching is pointed at the
    # keycloak service's internal address instead via KEYCLOAK_JWKS_URL —
    # "localhost" from inside this container is this container, not Keycloak.
    environment:
      KEYCLOAK_ISSUER: http://${AUTH_HOST}/realms/novel-tracker
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/novel-tracker/protocol/openid-connect/certs
