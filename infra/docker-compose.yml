services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: novel_tracker
      POSTGRES_USER: novel_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel_tracker -d novel_tracker"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/novel_tracker
      KC_DB_USERNAME: novel_tracker
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      KC_HOSTNAME: ${AUTH_HOST:?set AUTH_HOST}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/novel-tracker-realm.json:ro
    networks: [private]
    ports:
      - "127.0.0.1:${NOVEL_AUTH_HOST_PORT:-8793}:8080"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://novel_tracker:${POSTGRES_PASSWORD}@postgres:5432/novel_tracker
      KEYCLOAK_ISSUER: https://${AUTH_HOST}/realms/novel-tracker
      KEYCLOAK_AUDIENCE: novel-tracker-api
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [private]
    ports:
      - "127.0.0.1:${NOVEL_API_HOST_PORT:-8792}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  private:
