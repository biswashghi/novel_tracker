name: Novel Tracker server

on:
  pull_request:
    paths: &server-paths
      - server/**
      - infra/keycloak-realm*.json
      - infra/novel-tracker-backup.*
      - infra/novel-tracker-apple-secret.*
      - scripts/rotate-apple-secret.mjs
      - scripts/deploy-vps.sh
      - scripts/remote/**
      - deploy/**
      - tests/deploy-production.test.sh
      - tests/e2e/**
      - scripts/configure-keycloak.sh
      - scripts/backup-vps.sh
      - compose*.yml
      - Dockerfile
      - Makefile
      - package.json
      - package-lock.json
      - .github/workflows/deploy.yml
  push:
    branches: [main]
    paths: *server-paths
  workflow_dispatch:

concurrency:
  group: novel-tracker-server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check server/index.js
      - run: bash -n scripts/deploy-vps.sh scripts/remote/deploy-production.sh tests/deploy-production.test.sh scripts/configure-keycloak.sh scripts/backup-vps.sh
      - run: make production-validate

  build-candidate:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name != 'pull_request' && format('ghcr.io/{0}/novel-tracker-api:{1}', github.repository, github.sha) || format('novel-tracker-api:ci-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve immutable reference
        id: reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "image=novel-tracker-api:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${GITHUB_REPOSITORY}/novel-tracker-api@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi
      - name: Export pull-request image
        if: github.event_name == 'pull_request'
        run: docker save "novel-tracker-api:ci-${GITHUB_SHA}" | gzip > /tmp/novel-api-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: novel-api-candidate
          path: /tmp/novel-api-image.tar.gz
          retention-days: 1

  docker-staging:
    needs: build-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: novel-api-candidate
          path: /tmp
      - if: github.event_name == 'pull_request'
        run: gunzip -c /tmp/novel-api-image.tar.gz | docker load
      - if: github.event_name != 'pull_request'
        env:
          NOVEL_API_IMAGE: ${{ needs.build-candidate.outputs.image }}
        run: docker pull "$NOVEL_API_IMAGE"
      - name: Run authenticated ephemeral staging
        env:
          NOVEL_API_IMAGE: ${{ needs.build-candidate.outputs.image }}
          STAGING_NO_BUILD: "1"
          STAGING_PROJECT: novel-tracker-staging-${{ github.run_id }}
        run: make staging-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: novel-staging-diagnostics
          path: |
            staging.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  production:
    needs: [build-candidate, docker-staging]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET_CONFIGURED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || secrets.HETZNER_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.HETZNER_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ -n "$VPS_KNOWN_HOSTS" ]]; then printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts; fi
      - name: Pull and deploy tested API image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVEL_API_DOMAIN: ${{ vars.NOVEL_API_DOMAIN }}
          NOVEL_API_IMAGE: ${{ needs.build-candidate.outputs.image }}
          NOVEL_AUTH_DOMAIN: ${{ vars.NOVEL_AUTH_DOMAIN }}
          VPS_HOST: ${{ secrets.VPS_HOST || secrets.HETZNER_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          cleanup() { ssh "$VPS_USER@$VPS_HOST" 'sudo docker logout ghcr.io' || true; }
          trap cleanup EXIT
          printf '%s' "$GHCR_TOKEN" | ssh "$VPS_USER@$VPS_HOST" sudo docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ./scripts/deploy-vps.sh "$VPS_USER" "$VPS_HOST"
