name: Live site compatibility

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-compatibility
  cancel-in-progress: false

jobs:
  production-readiness:
    name: Production API and identity readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require healthy API, schema, release identity, and OIDC discovery
        env:
          API_DOMAIN: ${{ vars.NOVEL_API_DOMAIN }}
          AUTH_DOMAIN: ${{ vars.NOVEL_AUTH_DOMAIN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$API_DOMAIN" && -n "$AUTH_DOMAIN" ]]
          readiness="$(curl -fsS --retry 5 --retry-delay 5 "https://${API_DOMAIN}/ready")"
          jq -e '.ok == true and (.version | length > 0) and (.commit | length == 40) and (.schema | length > 0)' <<<"$readiness"
          curl -fsS --retry 5 --retry-delay 5 \
            "https://${AUTH_DOMAIN}/realms/novel-tracker/.well-known/openid-configuration" \
            | jq -e '.issuer | length > 0'

  chikari:
    name: Chikari chapter save and update
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the extension
        run: npm run build

      - name: Exercise live Chikari chapter flows
        run: npm run test:e2e:live

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chikari-live-site-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
