name: Release automation

on:
  workflow_dispatch:
    inputs:
      publish_to_stores:
        description: Publish to Chrome, Firefox, and Safari after successful packaging
        type: boolean
        default: false
      safari_platforms:
        description: 'Safari platform(s) to publish (scripts/publish-safari.mjs): "mac", "ios", or "mac,ios"'
        type: string
        default: 'mac,ios'
  push:
    tags:
      - 'v*'
      - '*.*.*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  build-chrome:
    name: Chrome package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome package
        run: |
          npm run build
          npm run package:webstore

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-package
          path: release/*.zip
          if-no-files-found: error

  build-firefox:
    name: Firefox package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Firefox package
        run: |
          npm run build:firefox
          npm run package:firefox

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-package
          path: release/*.zip
          if-no-files-found: error

  build-safari:
    name: Safari package
    needs: test
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Safari package
        run: |
          npm run build:safari
          npm run package:safari

      - name: Upload Safari artifact
        uses: actions/upload-artifact@v4
        with:
          name: safari-package
          path: release/*.zip
          if-no-files-found: error

      # publish-safari (below) needs the actual generated Xcode project, not
      # just the zip of it — Fastlane builds/archives/signs from the
      # xcodeproj directly (safari-app/fastlane/Fastfile), and that has to
      # run on a macOS runner, unlike the shared `publish` job below which
      # runs on ubuntu-latest for the Chrome/Firefox legs.
      - name: Upload Safari Xcode project artifact
        uses: actions/upload-artifact@v4
        with:
          name: safari-xcode-project
          path: build/safari-xcode
          if-no-files-found: error

  # `secrets` cannot be referenced inside any `if:` conditional — job-level
  # or step-level (actionlint flags this; GitHub's context-availability
  # table excludes `secrets` from both). This job resolves presence into
  # plain job outputs once, which downstream jobs/steps *can* read via
  # `needs.check-secrets.outputs.*` inside their own `if:`.
  check-secrets:
    name: Check publish secrets
    runs-on: ubuntu-latest
    outputs:
      chrome: ${{ steps.check.outputs.chrome }}
      firefox: ${{ steps.check.outputs.firefox }}
      safari: ${{ steps.check.outputs.safari }}
    steps:
      - name: Check which store secrets are configured
        id: check
        env:
          CHROME_WEB_STORE_EXTENSION_ID: ${{ secrets.CHROME_WEB_STORE_EXTENSION_ID }}
          CHROME_WEB_STORE_CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CHROME_WEB_STORE_CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          CHROME_WEB_STORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_P8: ${{ secrets.APP_STORE_CONNECT_P8 }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          chrome=false
          if [[ -n "$CHROME_WEB_STORE_EXTENSION_ID" && -n "$CHROME_WEB_STORE_CLIENT_ID" && -n "$CHROME_WEB_STORE_CLIENT_SECRET" && -n "$CHROME_WEB_STORE_REFRESH_TOKEN" ]]; then
            chrome=true
          fi

          firefox=false
          if [[ -n "$AMO_API_KEY" && -n "$AMO_API_SECRET" ]]; then
            firefox=true
          fi

          safari=false
          if [[ -n "$APP_STORE_CONNECT_KEY_ID" && -n "$APP_STORE_CONNECT_ISSUER_ID" && -n "$APP_STORE_CONNECT_P8" && -n "$APPSTORE_CERTIFICATES_FILE_BASE64" && -n "$APPSTORE_CERTIFICATES_PASSWORD" ]]; then
            safari=true
          fi

          {
            echo "chrome=$chrome"
            echo "firefox=$firefox"
            echo "safari=$safari"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to stores
    needs:
      - build-chrome
      - build-firefox
      - build-safari
      - check-secrets
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_to_stores == true) || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Resolve release ZIP paths
        id: release
        shell: bash
        run: |
          set -euo pipefail

          CHROME_ZIP=$(find release-artifacts/chrome-package -name '*.zip' -print -quit)
          FIREFOX_ZIP=$(find release-artifacts/firefox-package -name '*.zip' -print -quit)
          SAFARI_ZIP=$(find release-artifacts/safari-package -name '*.zip' -print -quit)

          [[ -n "$CHROME_ZIP" ]] || { echo 'Chrome ZIP not found'; exit 1; }
          [[ -n "$FIREFOX_ZIP" ]] || { echo 'Firefox ZIP not found'; exit 1; }
          [[ -n "$SAFARI_ZIP" ]] || { echo 'Safari ZIP not found'; exit 1; }

          {
            echo "chrome_zip=$CHROME_ZIP"
            echo "firefox_zip=$FIREFOX_ZIP"
            echo "safari_zip=$SAFARI_ZIP"
          } >> "$GITHUB_OUTPUT"

          ls -l "$CHROME_ZIP" "$FIREFOX_ZIP" "$SAFARI_ZIP"

      - name: Publish to Chrome Web Store
        id: publish-chrome
        continue-on-error: true
        if: ${{ needs.check-secrets.outputs.chrome == 'true' }}
        env:
          CHROME_WEB_STORE_EXTENSION_ID: ${{ secrets.CHROME_WEB_STORE_EXTENSION_ID }}
          CHROME_WEB_STORE_CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CHROME_WEB_STORE_CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          CHROME_WEB_STORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
        run: node scripts/publish-chrome.mjs "${{ steps.release.outputs.chrome_zip }}"

      - name: Publish to Firefox AMO
        if: ${{ needs.check-secrets.outputs.firefox == 'true' }}
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: node scripts/publish-firefox.mjs "${{ steps.release.outputs.firefox_zip }}"

      # Safari's own upload runs in publish-safari below, on a macOS runner —
      # Fastlane's build_app step needs real Xcode, which ubuntu-latest (this
      # job) doesn't have. This job still downloads and attaches the Safari
      # zip to the GitHub Release above/below, just doesn't publish it.

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.release.outputs.chrome_zip }}
            ${{ steps.release.outputs.firefox_zip }}
            ${{ steps.release.outputs.safari_zip }}

      # Chrome and Firefox are independent stores. A stale Chrome OAuth
      # token must not prevent Firefox from receiving an otherwise valid
      # release or suppress the GitHub release artifacts. Preserve a failed
      # job conclusion after those independent steps have had their chance.
      - name: Report Chrome publishing failure
        if: steps.publish-chrome.outcome == 'failure'
        run: exit 1

  publish-safari:
    name: Publish to App Store Connect
    needs: [build-safari, check-secrets]
    # Same trigger gate as `publish`, plus (at the job level, not just the
    # step) all three Apple secrets present — macOS runners are the most
    # expensive GitHub-hosted minute, not worth spinning one up just to have
    # the script immediately no-op on missing secrets.
    if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.publish_to_stores == true) || startsWith(github.ref, 'refs/tags/')) && needs.check-secrets.outputs.safari == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Import Apple distribution certificate
        shell: bash
        env:
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/novel-tracker-distribution.p12"
          keychain_path="$RUNNER_TEMP/novel-tracker-signing.keychain-db"

          printf '%s' "$APPSTORE_CERTIFICATES_FILE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$APPSTORE_CERTIFICATES_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPSTORE_CERTIFICATES_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPSTORE_CERTIFICATES_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | tee "$RUNNER_TEMP/codesigning-identities.txt"
          grep -Eq '1 valid identities found|Apple Distribution' "$RUNNER_TEMP/codesigning-identities.txt"

      - name: Download Safari package artifact
        uses: actions/download-artifact@v4
        with:
          name: safari-package
          path: release

      # Restores it to the same path scripts/package-safari.sh writes to
      # locally (build/safari-xcode/), which is also
      # safari-app/fastlane/Fastfile's default PROJECT location.
      - name: Download Safari Xcode project artifact
        uses: actions/download-artifact@v4
        with:
          name: safari-xcode-project
          path: build/safari-xcode

      - name: Resolve Safari ZIP path
        id: release
        shell: bash
        run: |
          set -euo pipefail
          SAFARI_ZIP=$(find release -name '*.zip' -print -quit)
          [[ -n "$SAFARI_ZIP" ]] || { echo 'Safari ZIP not found'; exit 1; }
          echo "safari_zip=$SAFARI_ZIP" >> "$GITHUB_OUTPUT"

      - name: Publish Safari archive to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_P8: ${{ secrets.APP_STORE_CONNECT_P8 }}
          # Empty on a tag-push trigger (no workflow_dispatch inputs exist
          # there) — publish-safari.mjs already defaults an unset/empty
          # value to "mac,ios", so that's fine.
          NOVEL_TRACKER_SAFARI_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.safari_platforms || '' }}
        run: node scripts/publish-safari.mjs "${{ steps.release.outputs.safari_zip }}"
