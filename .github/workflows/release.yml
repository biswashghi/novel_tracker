name: Store release

# Publishes to every store whenever main carries a package.json version that
# has no `v<version>` tag yet — i.e. after a version bump is merged. The tag
# is created last, once every store accepted the build, so a failed publish
# is fixed by merging a fix; the same version simply runs again.
#
# What a run submits: Chrome Web Store and Firefox AMO reviews (Chrome's is
# usually minutes), the iOS app to TestFlight, and the macOS app as an
# unsubmitted App Store draft. Publishing waits for approval of the
# `production` environment.

on:
  push:
    branches: [main]

concurrency:
  group: store-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Detect an unreleased version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      unreleased: ${{ steps.detect.outputs.unreleased }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: detect
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already released."
            unreleased=false
          else
            unreleased=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "unreleased=$unreleased" >> "$GITHUB_OUTPUT"

  build-browser:
    name: Browser packages
    needs: version
    if: needs.version.outputs.unreleased == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and validate the Chrome package
        run: |
          npm run package:webstore
          node scripts/validate-extension-package.mjs "release/novel-tracker-extension-${{ needs.version.outputs.version }}.zip" chrome
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrome-package
          path: release/novel-tracker-extension-[0-9]*.zip
          if-no-files-found: error
      - name: Build and validate the Firefox package
        run: |
          npm run package:firefox
          npm exec -- web-ext lint --source-dir dist-firefox
          node scripts/validate-extension-package.mjs "release/novel-tracker-extension-firefox-${{ needs.version.outputs.version }}.zip" firefox
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firefox-package
          path: release/*-firefox-*.zip
          if-no-files-found: error

  build-safari:
    name: Safari package
    needs: version
    if: needs.version.outputs.unreleased == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Apple's build number is the full commit count.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: npm ci
      - run: bundle exec ruby tests/apple-installer-certificate.test.rb
      - name: Package and compile the Safari apps
        run: make safari-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safari-package
          path: release/*.zip
          if-no-files-found: error

  candidate:
    name: Bind packages to this commit
    needs: [build-browser, build-safari]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chrome-package
          path: candidate/chrome
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: firefox-package
          path: candidate/firefox
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: safari-package
          path: candidate/safari
      - run: node scripts/release-manifest.mjs create candidate/release-manifest.json candidate/chrome/*.zip candidate/firefox/*.zip candidate/safari/*.zip
      - run: node scripts/release-manifest.mjs verify candidate/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: candidate
          if-no-files-found: error

  approve:
    name: Approve store publishing
    needs: [version, candidate]
    runs-on: ubuntu-latest
    # One environment approval releases all three publishers below.
    environment: production
    steps:
      - run: echo "Publishing ${{ needs.version.outputs.version }} from ${{ github.sha }}"

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: release-candidate
      - run: node scripts/release-manifest.mjs verify release-candidate/release-manifest.json
      - env:
          CHROME_WEB_STORE_EXTENSION_ID: ${{ secrets.CHROME_WEB_STORE_EXTENSION_ID }}
          CHROME_WEB_STORE_CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CHROME_WEB_STORE_CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          CHROME_WEB_STORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
        run: node scripts/publish-chrome.mjs release-candidate/chrome/*.zip

  publish-firefox:
    name: Publish to Firefox AMO
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: release-candidate
      - run: node scripts/release-manifest.mjs verify release-candidate/release-manifest.json
      - env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: node scripts/publish-firefox.mjs release-candidate/firefox/*.zip

  publish-safari:
    name: Publish to App Store Connect
    needs: approve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Import Apple distribution certificates
        env:
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          APPSTORE_INSTALLER_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_INSTALLER_CERTIFICATES_FILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/novel-tracker-signing.keychain-db"
          printf '%s' "$APPSTORE_CERTIFICATES_FILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/novel-tracker-distribution.p12"
          # The macOS lane combines the installer key with its Apple
          # certificate itself; only the distribution identity is imported.
          printf '%s' "$APPSTORE_INSTALLER_CERTIFICATES_FILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/novel-tracker-installer-distribution.p12"
          security create-keychain -p "$APPSTORE_CERTIFICATES_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPSTORE_CERTIFICATES_PASSWORD" "$keychain_path"
          security import "$RUNNER_TEMP/novel-tracker-distribution.p12" -P "$APPSTORE_CERTIFICATES_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -Eq '1 valid identities found|Apple Distribution'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: release-candidate
      - run: node scripts/release-manifest.mjs verify release-candidate/release-manifest.json
      - name: Unpack the verified Xcode project
        run: |
          set -euo pipefail
          mkdir -p build/safari-xcode
          unzip -q release-candidate/safari/*.zip -d build/safari-xcode
          test -f 'build/safari-xcode/Novel Tracker/Novel Tracker.xcodeproj/project.pbxproj'
      - name: Upload to TestFlight and the App Store
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_P8: ${{ secrets.APP_STORE_CONNECT_P8 }}
          NOVEL_TRACKER_KEYCHAIN_PATH: ${{ runner.temp }}/novel-tracker-signing.keychain-db
          NOVEL_TRACKER_KEYCHAIN_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          NOVEL_TRACKER_INSTALLER_P12_PATH: ${{ runner.temp }}/novel-tracker-installer-distribution.p12
          NOVEL_TRACKER_INSTALLER_P12_PASSWORD: ${{ secrets.APPSTORE_INSTALLER_CERTIFICATES_PASSWORD || secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          NOVEL_TRACKER_SAFARI_PLATFORMS: mac,ios
        run: node scripts/publish-safari.mjs release-candidate/safari/*.zip

  tag:
    name: Tag the released version
    needs: [version, publish-chrome, publish-firefox, publish-safari]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: release-candidate
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v${VERSION}" "$GITHUB_SHA"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "Novel Tracker ${VERSION}" --generate-notes \
            release-candidate/release-manifest.json release-candidate/*/*.zip
