version: 2

# One grouped pull request per week across every ecosystem.
multi-ecosystem-groups:
  all-updates:
    schedule:
      interval: weekly
      day: monday

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-updates

  - package-ecosystem: bundler
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-updates

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-updates

  - package-ecosystem: docker
    directory: /server
    patterns: ["*"]
    multi-ecosystem-group: all-updates
