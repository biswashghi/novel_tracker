services:
  postgres:
    restart: unless-stopped
    networks: [private]
    volumes:
      - postgres-data:/var/lib/postgresql/data
  keycloak:
    restart: unless-stopped
    expose: ["8080"]
    networks:
      private:
      edge:
        aliases: [novel-auth]
    volumes:
      - ./infra/keycloak-realm.json:/opt/keycloak/data/import/novel-tracker-realm.json:ro
  api:
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 15s
    expose: ["3000"]
    networks:
      private:
      edge:
        aliases: [novel-api]

volumes:
  postgres-data:
    name: infra_postgres-data

networks:
  private:
  edge:
    external: true
    name: vps-edge
