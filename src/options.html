<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novel Tracker</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>

    <!-- =========================================================
       INLINE SVG SPRITE
       No external icon files needed.
  ========================================================== -->
    <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        <symbol id="i-bookmark" viewBox="0 0 24 28">
            <path d="M5 2.5h14A1.5 1.5 0 0 1 20.5 4v21L12 19.6 3.5 25V4A1.5 1.5 0 0 1 5 2.5Z" fill="currentColor" />
        </symbol>

        <symbol id="i-book" viewBox="0 0 24 24">
            <path
                d="M3.5 5.3c3-.5 5.7.1 8 1.9v11.2c-2.3-1.8-5-2.4-8-1.9V5.3Zm17 0c-3-.5-5.7.1-8 1.9v11.2c2.3-1.8 5-2.4 8-1.9V5.3Z"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
            <path d="M12 7.2v11.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </symbol>

        <symbol id="i-library" viewBox="0 0 24 24">
            <path d="M4.5 4.5h3v15h-3v-15Zm5.5 0h3v15h-3v-15Zm5.6-.5 2.8-.8 4 14.5-2.9.8L15.6 4Z" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </symbol>

        <symbol id="i-search" viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="m15 15 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </symbol>

        <symbol id="i-cloud" viewBox="0 0 24 24">
            <path d="M7 18.2h-.5a4.1 4.1 0 0 1-.7-8.1A6 6 0 0 1 17.4 8.5a4.4 4.4 0 0 1-.3 8.8h-1.2" fill="none"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </symbol>

        <symbol id="i-cloud-check" viewBox="0 0 24 24">
            <path d="M7 17.8h-.5a4 4 0 0 1-.7-7.9A6 6 0 0 1 17.4 8.3a4.3 4.3 0 0 1-.2 8.6h-1" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="m9.4 15.7 2 2 3.6-3.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                stroke-linejoin="round" />
        </symbol>

        <symbol id="i-sync" viewBox="0 0 24 24">
            <path d="M18.2 8.2A7 7 0 0 0 6.7 6.7L4.5 9M4.5 5.3V9h3.8" fill="none" stroke="currentColor"
                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M5.8 15.8a7 7 0 0 0 11.5 1.5l2.2-2.3M19.5 18.7V15h-3.8" fill="none" stroke="currentColor"
                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>

        <symbol id="i-google" viewBox="0 0 24 24">
            <path fill="#4285F4"
                d="M23.06 12.25c0-.85-.08-1.67-.22-2.45H12v4.64h6.2a5.3 5.3 0 0 1-2.3 3.48v2.89h3.72c2.18-2 3.44-4.96 3.44-8.56z" />
            <path fill="#34A853"
                d="M12 23.5c3.11 0 5.72-1.03 7.62-2.79l-3.72-2.89c-1.03.69-2.35 1.1-3.9 1.1-3 0-5.54-2.03-6.45-4.75H1.7v2.98A11.5 11.5 0 0 0 12 23.5z" />
            <path fill="#FBBC05" d="M5.55 14.17a6.9 6.9 0 0 1 0-4.34V6.85H1.7a11.5 11.5 0 0 0 0 10.3l3.85-2.98z" />
            <path fill="#EA4335"
                d="M12 4.75c1.69 0 3.21.58 4.4 1.72l3.3-3.3C17.72 1.28 15.11.25 12 .25A11.5 11.5 0 0 0 1.7 6.85l3.85 2.98C6.46 7.11 9 4.75 12 4.75z" />
        </symbol>

        <symbol id="i-apple" viewBox="0 0 24 24">
            <path fill="currentColor"
                d="M16.36 12.78c.02-2.2 1.8-3.26 1.88-3.31-1.02-1.5-2.61-1.7-3.18-1.73-1.35-.14-2.64.79-3.33.79-.69 0-1.75-.77-2.87-.75-1.48.02-2.84.86-3.6 2.18-1.53 2.66-.39 6.6 1.1 8.76.73 1.06 1.6 2.25 2.74 2.2 1.1-.04 1.52-.71 2.85-.71 1.33 0 1.7.71 2.87.69 1.18-.02 1.93-1.08 2.65-2.14.84-1.23 1.18-2.42 1.2-2.48-.03-.01-2.3-.88-2.32-3.5z" />
            <path fill="currentColor"
                d="M14.2 6.4c.6-.74 1.01-1.76.9-2.78-.87.04-1.93.58-2.56 1.31-.56.65-1.05 1.69-.92 2.69.97.07 1.97-.49 2.58-1.22z" />
        </symbol>

        <symbol id="i-user" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7" />
            <path d="M5.5 19c.8-3.2 3.1-5 6.5-5s5.7 1.8 6.5 5" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" />
        </symbol>

        <symbol id="i-import" viewBox="0 0 24 24">
            <path d="M12 4v10m0 0-3.4-3.4M12 14l3.4-3.4M5 18v1.1A1.9 1.9 0 0 0 6.9 21h10.2a1.9 1.9 0 0 0 1.9-1.9V18"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>

        <symbol id="i-export" viewBox="0 0 24 24">
            <path d="M12 14V4m0 0L8.6 7.4M12 4l3.4 3.4M5 18v1.1A1.9 1.9 0 0 0 6.9 21h10.2a1.9 1.9 0 0 0 1.9-1.9V18"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>

        <symbol id="i-trash" viewBox="0 0 24 24">
            <path d="M5 7h14M9 7V4.5h6V7m2 0-.8 12H7.8L7 7M10 10.5V16M14 10.5V16" fill="none" stroke="currentColor"
                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>

        <symbol id="i-exit" viewBox="0 0 24 24">
            <path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10" fill="none" stroke="currentColor"
                stroke-width="1.7" stroke-linecap="round" />
            <path d="M13 8l4 4-4 4M17 12H9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                stroke-linejoin="round" />
        </symbol>

        <symbol id="i-filter" viewBox="0 0 24 24">
            <path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" />
        </symbol>

        <symbol id="i-sort" viewBox="0 0 24 24">
            <path d="M8 5v14m0 0-3-3m3 3 3-3M16 19V5m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>

        <symbol id="i-spark" viewBox="0 0 24 24">
            <path d="M12 3.5 13.6 8l4.5 1.6-4.5 1.6L12 15.7l-1.6-4.5-4.5-1.6L10.4 8 12 3.5Z" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <path d="m18 15 .8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8L18 15Z" fill="currentColor" />
        </symbol>

        <symbol id="i-external" viewBox="0 0 24 24">
            <path d="M14 5h5v5m0-5-8 8M17 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h5" fill="none"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>

        <symbol id="i-edit" viewBox="0 0 24 24">
            <path d="m5 16-.8 3.8L8 19l9.8-9.8-3-3L5 16Zm8.8-8.8 3 3" fill="none" stroke="currentColor"
                stroke-width="1.7" stroke-linejoin="round" />
        </symbol>

        <symbol id="i-history" viewBox="0 0 24 24">
            <path d="M5.2 7.2A7.5 7.5 0 1 1 4.5 14M5.5 3.9v4H9.6M12 8.2v4.3l2.7 1.7" fill="none" stroke="currentColor"
                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>

        <symbol id="i-check" viewBox="0 0 24 24">
            <path d="m5.5 12.5 4 4L18.5 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                stroke-linejoin="round" />
        </symbol>

        <symbol id="i-star" viewBox="0 0 24 24">
            <path d="m12 3.5 2.5 5.4 5.9.7-4.4 4 1.2 5.9-5.2-3-5.2 3 1.2-5.9-4.4-4 5.9-.7L12 3.5Z" fill="currentColor" />
        </symbol>

        <symbol id="i-tag" viewBox="0 0 24 24">
            <path d="M12.4 4h5.6a2 2 0 0 1 2 2v5.6a2 2 0 0 1-.6 1.4l-8 8a2 2 0 0 1-2.8 0l-5.6-5.6a2 2 0 0 1 0-2.8l8-8a2 2 0 0 1 1.4-.6Z"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <circle cx="15.5" cy="8.5" r="1.4" fill="currentColor" />
        </symbol>

        <symbol id="i-flame" viewBox="0 0 24 24">
            <path
                d="M12 3s4 3.6 4 7.6a4 4 0 0 1-8 0c0-1 .4-1.8 1-2.6-.2 1.2.2 2 1 2.4-.3-2 .6-3.6 2-4.6-.2 1.4.4 2.4 1.4 3 .5.3.8.8.8 1.4a2.2 2.2 0 0 1-4.4 0"
                fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
        </symbol>

    </svg>

    <!-- =========================================================
       TOP APPLICATION BAR
  ========================================================== -->
    <header class="topbar">

        <div class="topbar-inner">

            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg>
                        <use href="#i-bookmark"></use>
                    </svg>
                </span>

                <span class="brand-name">
                    Novel Tracker
                </span>
            </div>

            <div class="topbar-account">

                <div class="account-summary">

                    <span class="account-icon" aria-hidden="true">
                        <svg>
                            <use href="#i-cloud-check"></use>
                        </svg>
                    </span>

                    <div class="account-copy">
                        <strong id="account-title">
                            Stored locally
                        </strong>

                        <span id="sync-detail">
                            No account required
                        </span>
                    </div>

                    <span id="sync-indicator" class="sync-indicator" aria-hidden="true"></span>

                </div>

                <div class="account-actions">

                    <!-- One button per entry in AUTH_PROVIDERS (lib/config.js),
                         rendered by options.js so adding a provider stays a
                         config change. -->
                    <div id="sign-in-actions" class="sign-in-actions"></div>

                    <button type="button" id="sync-now" class="top-action" hidden>
                        <svg>
                            <use href="#i-sync"></use>
                        </svg>

                        <span>Sync</span>
                    </button>

                    <button type="button" id="sign-out" class="icon-action subtle-action" aria-label="Sign out"
                        title="Sign out" hidden>
                        <svg>
                            <use href="#i-exit"></use>
                        </svg>
                    </button>

                    <button type="button" id="delete-account" class="icon-action danger-action"
                        aria-label="Delete account" title="Delete account" hidden>
                        <svg>
                            <use href="#i-trash"></use>
                        </svg>
                    </button>

                </div>

            </div>

            <div class="topbar-data">

                <button type="button" id="import-json" class="icon-action" aria-label="Import library"
                    title="Import library">
                    <svg>
                        <use href="#i-import"></use>
                    </svg>
                </button>

                <button type="button" id="export-json" class="icon-action" aria-label="Export library"
                    title="Export library">
                    <svg>
                        <use href="#i-export"></use>
                    </svg>
                </button>

                <input type="file" id="import-file" accept="application/json,.json" hidden>

            </div>

        </div>

    </header>


    <!-- =========================================================
       MAIN LIBRARY
  ========================================================== -->
    <main class="workspace">

        <section class="hero">

            <div class="hero-copy">

                <div class="hero-kicker">
                    <svg aria-hidden="true">
                        <use href="#i-library"></use>
                    </svg>

                    Your library
                </div>

                <h1>
                    Pick up where you left off.
                </h1>

                <div class="hero-rule"></div>

            </div>

            <div class="hero-art" aria-hidden="true">

                <svg class="hero-book">
                    <use href="#i-book"></use>
                </svg>

                <svg class="hero-spark hero-spark-one">
                    <use href="#i-spark"></use>
                </svg>

                <svg class="hero-spark hero-spark-two">
                    <use href="#i-spark"></use>
                </svg>

            </div>

        </section>


        <!-- =======================================================
         READING STATS
    ======================================================== -->
        <section class="stats-bar" id="stats-bar">

            <div class="stat-card">
                <span class="stat-icon" aria-hidden="true">
                    <svg>
                        <use href="#i-flame"></use>
                    </svg>
                </span>
                <div class="stat-copy">
                    <strong id="stat-streak">0</strong>
                    <span>Day streak</span>
                </div>
            </div>

            <div class="stat-card">
                <span class="stat-icon" aria-hidden="true">
                    <svg>
                        <use href="#i-bookmark"></use>
                    </svg>
                </span>
                <div class="stat-copy">
                    <strong id="stat-week">0</strong>
                    <span>Chapters this week</span>
                </div>
            </div>

            <div class="stat-card">
                <span class="stat-icon" aria-hidden="true">
                    <svg>
                        <use href="#i-history"></use>
                    </svg>
                </span>
                <div class="stat-copy">
                    <strong id="stat-month">0</strong>
                    <span>Chapters this month</span>
                </div>
            </div>

            <div class="stat-card">
                <span class="stat-icon" aria-hidden="true">
                    <svg>
                        <use href="#i-library"></use>
                    </svg>
                </span>
                <div class="stat-copy">
                    <strong id="stat-completed">0</strong>
                    <span>Completed of <span id="stat-total">0</span></span>
                </div>
            </div>

        </section>


        <!-- =======================================================
         FILTER BAR
    ======================================================== -->
        <section class="filter-bar">

            <div class="search-wrap">

                <svg aria-hidden="true">
                    <use href="#i-search"></use>
                </svg>

                <input id="search" type="search" placeholder="Find a novel, source, tag, or note…">

            </div>

            <div class="filter-rule"></div>

            <label class="compact-filter">

                <span>
                    <svg aria-hidden="true">
                        <use href="#i-filter"></use>
                    </svg>

                    Status
                </span>

                <select id="status-filter">
                    <option value="all">All</option>
                    <option value="active">Active</option>
                    <option value="paused">Paused</option>
                    <option value="completed">Completed</option>
                    <option value="dropped">Dropped</option>
                </select>

            </label>

            <label class="compact-filter">

                <span>
                    <svg aria-hidden="true">
                        <use href="#i-tag"></use>
                    </svg>

                    Tag
                </span>

                <select id="tag-filter">
                    <option value="all">All</option>
                </select>

            </label>

            <label class="compact-filter">

                <span>
                    <svg aria-hidden="true">
                        <use href="#i-sort"></use>
                    </svg>

                    Sort
                </span>

                <select id="sort">
                    <option value="updated">Recent</option>
                    <option value="title">Title</option>
                    <option value="source">Source</option>
                    <option value="rating">Rating</option>
                </select>

            </label>

        </section>


        <!-- =======================================================
         JS RENDERS NOVELS HERE
    ======================================================== -->
        <section id="library" class="library"></section>

    </main>

    <script type="module" src="options.js"></script>

</body>

</html>
