<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novel Tracker Library</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .shell {
        min-height: 100vh;
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px;
        display: grid;
        align-content: start;
        gap: 12px;
      }

      .header {
        padding: 18px 20px;
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 18px;
        background:
          radial-gradient(circle at top left, rgba(233, 212, 182, 0.55), transparent 34%),
          linear-gradient(135deg, rgba(255, 250, 242, 0.96), rgba(250, 241, 228, 0.94));
      }

      .header-copy {
        display: grid;
        gap: 10px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--accent-strong);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 32px;
        height: 1px;
        background: rgba(159, 93, 47, 0.45);
      }

      .header h1 {
        margin: 0;
        font-size: clamp(1.85rem, 3vw, 2.4rem);
        line-height: 0.98;
        letter-spacing: -0.03em;
      }

      .header p {
        margin: 0;
        color: var(--muted);
        max-width: 680px;
        line-height: 1.35;
        font-size: 0.98rem;
      }

      .header-stats {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: end;
        padding-top: 4px;
      }

      .header-tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: end;
      }

      .toolbar {
        padding: 10px 14px;
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 8px;
        align-items: end;
      }

      .library {
        display: grid;
        gap: 12px;
      }

      .empty {
        padding: 22px;
        text-align: center;
        color: var(--muted);
      }

      .card {
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr);
        gap: 14px;
        padding: 14px;
        align-items: start;
        height: fit-content;
      }

      .cover,
      .cover img {
        width: 84px;
        height: 112px;
        border-radius: 12px;
      }

      .cover {
        background: linear-gradient(180deg, #c79063 0%, #85502f 100%);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fffaf4;
        font-weight: 700;
        text-align: center;
        padding: 12px;
      }

      .content {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .title-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
      }

      .title-row h2 {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.15;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .meta span:not(:last-child)::after {
        content: "•";
        margin-left: 6px;
      }

      .chapter-link {
        color: var(--muted);
        font-size: 0.84rem;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .history {
        border-top: 1px solid rgba(217, 201, 168, 0.65);
        padding-top: 8px;
      }

      .history summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 700;
        list-style: none;
      }

      .history summary::-webkit-details-marker {
        display: none;
      }

      .history-list {
        display: grid;
        gap: 6px;
        margin-top: 8px;
      }

      .history-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: baseline;
        font-size: 0.84rem;
      }

      .history-item a {
        color: var(--text);
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .history-item a:hover {
        text-decoration: underline;
      }

      .history-time {
        color: var(--muted);
        white-space: nowrap;
      }

      .toolbar .field {
        gap: 4px;
      }

      .toolbar .field label {
        font-size: 0.82rem;
      }

      .toolbar .field input,
      .toolbar .field select {
        min-height: 40px;
        padding: 8px 12px;
      }

      .edit-grid {
        display: none;
        gap: 10px;
        padding-top: 6px;
      }

      .card.editing .edit-grid {
        display: grid;
      }

      .edit-grid .actions {
        padding-top: 2px;
      }

      @media (max-width: 780px) {
        .shell {
          padding: 12px;
        }

        .header {
          grid-template-columns: 1fr;
          display: grid;
        }

        .header-stats {
          justify-content: start;
        }

        .header-tools {
          justify-content: start;
        }

        .toolbar,
        .card {
          grid-template-columns: 1fr;
        }

        .title-row {
          grid-template-columns: 1fr;
        }

        .chapter-link {
          white-space: normal;
          word-break: break-all;
        }

        .history-item {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="panel header">
        <div class="header-copy">
          <span class="eyebrow">Reading archive</span>
          <h1>Keep every chapter trail in one place.</h1>
          <p>Track your active novels, reopen exactly where you left off, and keep a clean history whenever chapter URLs move forward.</p>
        </div>
        <div>
          <div class="header-tools">
            <button type="button" class="secondary" id="export-json">Export JSON</button>
            <button type="button" class="ghost" id="import-json">Import JSON</button>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
          </div>
          <div class="header-stats" id="header-stats"></div>
        </div>
      </section>

      <section class="panel toolbar">
        <div class="field">
          <label for="search">Search</label>
          <input id="search" placeholder="Search by title or site">
        </div>
        <div class="field">
          <label for="status-filter">Status</label>
          <select id="status-filter">
            <option value="all">All statuses</option>
            <option value="active">Active</option>
            <option value="paused">Paused</option>
            <option value="completed">Completed</option>
            <option value="dropped">Dropped</option>
          </select>
        </div>
        <div class="field">
          <label for="sort">Sort</label>
          <select id="sort">
            <option value="updated">Recently updated</option>
            <option value="title">Title</option>
            <option value="source">Source site</option>
          </select>
        </div>
      </section>

      <section id="library" class="library"></section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
